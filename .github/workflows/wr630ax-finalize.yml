name: Finalize WR630AX upstream commit

on:
  push:
    branches:
      - wr630ax-finalize-helper
    paths:
      - '.github/workflows/wr630ax-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate DCO-correct final commit
        shell: bash
        run: |
          set -euxo pipefail

          source_branch='mediatek-filogic-cf-wr630ax-sysupgrade-validation'
          final_branch='mediatek-filogic-cf-wr630ax-final'

          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch upstream main
          base="$(git rev-parse upstream/main)"

          git fetch origin "$source_branch" "$final_branch"
          old_final="$(git rev-parse origin/"$final_branch")"

          git checkout -B "$final_branch" "$base"

          git diff --binary "$base"...origin/"$source_branch" -- \
            package/boot/uboot-tools/uboot-envtools/files/mediatek_filogic \
            target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts \
            target/linux/mediatek/filogic/base-files/etc/board.d/01_leds \
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network \
            target/linux/mediatek/image/filogic.mk \
            | git apply --index -

          git diff --cached --check

          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'EOF'
          package/boot/uboot-tools/uboot-envtools/files/mediatek_filogic
          target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          target/linux/mediatek/filogic/base-files/etc/board.d/01_leds
          target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          target/linux/mediatek/image/filogic.mk
          EOF
          git diff --cached --name-only | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

          wr_block="$(sed -n '/^define Device\/comfast_cf-wr630ax$/,/^endef$/p' target/linux/mediatek/image/filogic.mk)"
          printf '%s\n' "$wr_block"
          ! grep -Fq 'factory.bin' <<<"$wr_block"
          grep -Fxq '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' <<<"$wr_block"
          grep -Fxq '  SUPPORTED_DEVICES += cf-wr630ax' <<<"$wr_block"

          # Check the newly-added board entries are placed consistently.
          test "$(grep -n '^comfast,cf-wa933|\\$' target/linux/mediatek/filogic/base-files/etc/board.d/01_leds | cut -d: -f1)" -lt \
               "$(grep -n '^comfast,cf-wr630ax)$' target/linux/mediatek/filogic/base-files/etc/board.d/01_leds | cut -d: -f1)"
          test "$(grep -n $'^\\tbuffalo,wsr-6000ax8|\\\\$' target/linux/mediatek/filogic/base-files/etc/board.d/02_network | cut -d: -f1)" -lt \
               "$(grep -n $'^\\tcomfast,cf-wr630ax|\\\\$' target/linux/mediatek/filogic/base-files/etc/board.d/02_network | cut -d: -f1)"
          test "$(grep -n '^comfast,cf-e393ax|\\$' package/boot/uboot-tools/uboot-envtools/files/mediatek_filogic | cut -d: -f1)" -lt \
               "$(grep -n '^comfast,cf-wr630ax|\\$' package/boot/uboot-tools/uboot-envtools/files/mediatek_filogic | cut -d: -f1)"

          git config user.name 'Stefan Lindholm'
          git config user.email 'openwrt@stli.se'

          msg="$(mktemp)"
          cat > "$msg" <<'EOF'
          mediatek: add support for COMFAST CF-WR630AX

          Add support for the COMFAST CF-WR630AX, an MT7981B-based Wi-Fi 6
          router.

          Hardware specification
          ----------------------

          - SoC: MediaTek MT7981B
          - RAM: 256 MiB DDR3
          - Flash: 128 MiB Winbond SPI-NAND
          - Wi-Fi: 2.4/5 GHz 2x2 802.11ax (MT7981B + MT7976CN)
          - Ethernet: 3x 1GbE LAN via MT7531, 1x 1GbE WAN via MT7981 PHY
          - LEDs: 4x GPIO (Mesh, WAN, 2.4 GHz, 5 GHz)
          - Buttons: 2x GPIO (Reset, WPS/Mesh)
          - UART: PCB header next to heatsink, VCC/GND/RX/TX, 115200 8N1
          - UART level: 3.3 V TTL; connect GND/TX/RX only, leave VCC open
          - Power: 12 VDC, 1 A

          Flash instructions
          ------------------

          For normal installation from COMFAST stock firmware, open the stock
          firmware-update WebUI, select the OpenWrt sysupgrade image, start the
          upgrade, and wait for the router to reboot:

            openwrt-mediatek-filogic-comfast_cf-wr630ax-squashfs-sysupgrade.bin

          Opening the enclosure is not required for normal installation.

          The stock firmware uses the OpenWrt sysupgrade archive format with
          legacy board ID "cf-wr630ax". Keep that ID in SUPPORTED_DEVICES for
          stock-to-OpenWrt migration.

          For recovery, connect the UART and a TFTP server at 192.168.1.10.
          Rename the initramfs image to "wr630ax-initramfs.bin", interrupt
          U-Boot autoboot, and run:

            tftpboot ${loadaddr} wr630ax-initramfs.bin
            iminfo ${loadaddr}
            bootm ${loadaddr}

          After OpenWrt boots from RAM, copy the sysupgrade image to /tmp,
          verify it with sysupgrade -T, then install it with sysupgrade -n.

          Reverting to the COMFAST stock firmware has not been verified on
          hardware, so no unverified stock-flash procedure is documented here.

          MAC address layout
          ------------------

          - LAN: Factory + 0xe000
          - WAN: Factory + 0xe000, incremented by 1
          - 2.4 GHz: Factory + 0x0004
          - 5 GHz: Factory + 0x8000

          BL2, u-boot-env, Factory and FIP are outside the OpenWrt UBI
          partition and were verified unchanged after sysupgrade.

          This work continues the earlier CF-WR630AX support submitted by ddf29
          in #20654, with the original device-support commit authored by
          dingjie <DW22965391@outlook.com>. The port has since been completed,
          updated for current OpenWrt main, and verified on hardware.

          Signed-off-by: dingjie <DW22965391@outlook.com>
          [Stefan Lindholm: complete and verify port; update for current main]
          EOF

          git commit --author='dingjie <DW22965391@outlook.com>' -s -F "$msg"

          test "$(git show -s --format='%an <%ae>' HEAD)" = 'dingjie <DW22965391@outlook.com>'
          test "$(git show -s --format='%cn <%ce>' HEAD)" = 'Stefan Lindholm <openwrt@stli.se>'
          git show -s --format='%B' HEAD | grep -Fxq 'Signed-off-by: dingjie <DW22965391@outlook.com>'
          git show -s --format='%B' HEAD | grep -Fxq 'Signed-off-by: Stefan Lindholm <openwrt@stli.se>'
          git show -s --format='%B' HEAD | grep -Fq 'submitted by ddf29'
          git show -s --format='%B' HEAD | grep -Fq 'dingjie <DW22965391@outlook.com>'

          subject="$(git show -s --format='%s' HEAD)"
          test "${#subject}" -lt 50
          git show -s --format='%B' HEAD | awk '
            length($0) >= 75 {
              print "commit-message line too long: " length($0) ": " $0
              bad=1
            }
            END { exit bad }
          '

          for section in 'Hardware specification' 'Flash instructions' 'MAC address layout'; do
            git show -s --format='%B' HEAD | grep -Fxq "$section"
          done

          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base"..HEAD | wc -l)" -eq 5
          git diff --check "$base"..HEAD

          echo "BASE=$base"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --stat "$base"..HEAD
          git show --no-ext-diff --format=fuller --stat HEAD

          git push --force-with-lease=refs/heads/"$final_branch":"$old_final" \
            origin HEAD:refs/heads/"$final_branch"
