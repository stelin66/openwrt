name: Finalize WR630AX upstream commit

on:
  push:
    branches:
      - wr630ax-finalize-helper
    paths:
      - '.github/workflows/wr630ax-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate DCO-correct final commit
        shell: bash
        run: |
          set -euxo pipefail

          source_branch='mediatek-filogic-cf-wr630ax-sysupgrade-validation'
          final_branch='mediatek-filogic-cf-wr630ax-final'

          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch upstream main
          base="$(git rev-parse upstream/main)"

          git fetch origin "$source_branch" "$final_branch"
          old_final="$(git rev-parse origin/"$final_branch")"

          git checkout -B "$final_branch" "$base"

          git diff --binary "$base"...origin/"$source_branch" -- \
            package/boot/uboot-tools/uboot-envtools/files/mediatek_filogic \
            target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts \
            target/linux/mediatek/filogic/base-files/etc/board.d/01_leds \
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network \
            target/linux/mediatek/image/filogic.mk \
            | git apply --index -

          git diff --cached --check

          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'EOF'
          package/boot/uboot-tools/uboot-envtools/files/mediatek_filogic
          target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          target/linux/mediatek/filogic/base-files/etc/board.d/01_leds
          target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          target/linux/mediatek/image/filogic.mk
          EOF
          git diff --cached --name-only | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

          # The final device profile must emit sysupgrade + initramfs kernel,
          # not the obsolete unverified factory image, and must accept the
          # legacy stock COMFAST board identifier during migration.
          wr_block="$(sed -n '/^define Device\/comfast_cf-wr630ax$/,/^endef$/p' target/linux/mediatek/image/filogic.mk)"
          printf '%s\n' "$wr_block"
          ! grep -Fq 'factory.bin' <<<"$wr_block"
          grep -Fxq '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' <<<"$wr_block"
          grep -Fxq '  SUPPORTED_DEVICES += cf-wr630ax' <<<"$wr_block"

          git config user.name 'Stefan Lindholm'
          git config user.email 'openwrt@stli.se'

          msg="$(mktemp)"
          cat > "$msg" <<'EOF'
          mediatek: add support for COMFAST CF-WR630AX

          Add support for the COMFAST CF-WR630AX, an MT7981B-based Wi-Fi 6
          router.

          Specification
          -------------

          - SoC: MediaTek MT7981B
          - RAM: 256 MiB DDR3
          - Flash: 128 MiB Winbond SPI-NAND
          - Switch: MediaTek MT7531
          - Ethernet: 3x 1GbE LAN, 1x 1GbE WAN
          - Wi-Fi: 2.4 GHz and 5 GHz 802.11ax
          - Buttons: Reset, WPS
          - LEDs: Mesh, WAN, 2.4 GHz, 5 GHz
          - UART: 3.3 V TTL, 115200 8N1

          Installation
          ------------

          From the COMFAST stock firmware, upload
          openwrt-mediatek-filogic-comfast_cf-wr630ax-squashfs-sysupgrade.bin
          using the stock firmware-update WebUI and wait for the router to
          reboot into OpenWrt.

          The COMFAST stock firmware uses the OpenWrt sysupgrade archive format
          with legacy board ID "cf-wr630ax". Keep this ID in SUPPORTED_DEVICES
          so the stock-to-OpenWrt migration is accepted.

          Recovery
          --------

          If the stock WebUI is unavailable, use the 3.3 V TTL UART at 115200
          8N1 with GND/TX/RX only; do not connect VCC. From U-Boot, load the
          initramfs image by TFTP and boot it in RAM:

             tftpboot ${loadaddr} openwrt-mediatek-filogic-comfast_cf-wr630ax-initramfs-kernel.bin
             iminfo ${loadaddr}
             bootm ${loadaddr}

          Then copy the sysupgrade image to /tmp, verify it with sysupgrade -T,
          and install it with sysupgrade -n.

          The board DTS provides per-band Wi-Fi MAC addresses from Factory
          NVMEM cells. BL2, u-boot-env, Factory and FIP stay outside the OpenWrt
          UBI partition and are not modified by sysupgrade.

          This work continues the earlier CF-WR630AX support submitted by ddf29
          in #20654, with the original device-support commit authored by
          dingjie <DW22965391@outlook.com>. The port has since been completed,
          updated for current OpenWrt main, and verified on hardware.
          EOF

          git commit -s -F "$msg"

          test "$(git show -s --format='%an <%ae>' HEAD)" = 'Stefan Lindholm <openwrt@stli.se>'
          test "$(git show -s --format='%cn <%ce>' HEAD)" = 'Stefan Lindholm <openwrt@stli.se>'
          git show -s --format='%B' HEAD | grep -Fxq 'Signed-off-by: Stefan Lindholm <openwrt@stli.se>'
          git show -s --format='%B' HEAD | grep -Fq 'submitted by ddf29'
          git show -s --format='%B' HEAD | grep -Fq 'dingjie <DW22965391@outlook.com>'
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base"..HEAD | wc -l)" -eq 5
          git diff --check "$base"..HEAD

          echo "BASE=$base"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --stat "$base"..HEAD
          git show --no-ext-diff --format=fuller --stat HEAD

          git push --force-with-lease=refs/heads/"$final_branch":"$old_final" \
            origin HEAD:refs/heads/"$final_branch"
